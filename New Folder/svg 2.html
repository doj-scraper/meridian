<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Flask SVG Animations</title>
<style>
  :root{
    --bg:#0f1220;
    --panel:#151933;
    --muted:#9aa3b2;
    --text:#e8ecf1;
    --accent:#6ea8fe;
    --ok:#2ecc71;
    --warn:#f39c12;
  }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:linear-gradient(180deg,#0b0e1a,#0f1220 30%,#0e1222);
    color:var(--text);
    font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{
    width:min(980px,96vw);
    margin:24px auto 48px;
  }
  h1{
    margin:0 0 12px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .sub{
    margin:0 0 20px;
    color:var(--muted);
    font-size:.95rem;
  }
  .stage{
    display:grid;
    grid-template-columns: 1fr;
    gap:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0)) , var(--panel);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .svg-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:12px;
  }
  svg{
    width:min(320px,92vw);
    height:auto;
    display:block;
  }

  .controls{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(130px,1fr));
    gap:10px;
  }
  button{
    appearance:none;
    border:1px solid rgba(255,255,255,.12);
    background:linear-gradient(180deg,#1b2040,#161a33);
    color:var(--text);
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
    letter-spacing:.2px;
    transition:transform .06s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
    box-shadow:0 2px 8px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.06);
  }
  button:hover{ transform:translateY(-1px); border-color:rgba(255,255,255,.2); }
  button:active{ transform:translateY(0); }
  button.active{
    border-color:#6ea8fe;
    box-shadow:0 0 0 3px rgba(110,168,254,.15), 0 6px 18px rgba(110,168,254,.25);
    background:linear-gradient(180deg,#223066,#1b244a);
  }
  .btn-ok{ border-color:rgba(46,204,113,.35); color:#d9ffe2; }
  .btn-ok.active{ border-color:#2ecc71; box-shadow:0 0 0 3px rgba(46,204,113,.18), 0 6px 18px rgba(46,204,113,.25); }
  .btn-warn{ border-color:rgba(243,156,18,.35); color:#fff6e0; }
  .btn-warn.active{ border-color:#f39c12; box-shadow:0 0 0 3px rgba(243,156,18,.18), 0 6px 18px rgba(243,156,18,.25); }

  .hint{
    font-size:.9rem;
    color:var(--muted);
    margin-top:6px;
  }
  .kbd{
    display:inline-block;
    padding:2px 6px;
    border-radius:6px;
    background:#0c1022;
    border:1px solid rgba(255,255,255,.12);
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    font-size:.85rem;
    color:#c9d2e6;
  }

  /* Animation definitions */
  @keyframes bubbleUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-68px) scale(1.25); opacity: 0; }
  }
  @keyframes bubbleUpSlow {
    0%   { transform: translateY(0) scale(1); opacity: 0.9; }
    100% { transform: translateY(-68px) scale(1.25); opacity: 0; }
  }
  .bubbles .bubble {
    animation: bubbleUp 2.2s ease-in infinite;
  }
  .bubbles-slow .bubble {
    animation: bubbleUpSlow 3.4s ease-in infinite;
  }

  .bubble { transform-origin: 50% 50%; will-change: transform, opacity; }

  /* Pulsing glow */
  @keyframes pulseGlow {
    0%,100% { filter: url(#glow) drop-shadow(0 0 2px rgba(77,208,225,.6)) drop-shadow(0 0 6px rgba(156,39,176,.7)); }
    50%     { filter: url(#glow) drop-shadow(0 0 8px rgba(255,107,53,.6)) drop-shadow(0 0 14px rgba(77,208,225,.9)); }
  }
  .pulse .flask-stroke { animation: pulseGlow 3s ease-in-out infinite; }

  /* Shake + bubbles */
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }
  .shake .flask-stroke { animation: shake 90ms infinite; }

  /* Think trace (stroke-dash) */
  @keyframes thinkTrace {
    0%   { stroke-dasharray: 0 1000; stroke-dashoffset: 0; }
    50%  { stroke-dasharray: 1000 1000; stroke-dashoffset: -500; }
    100% { stroke-dasharray: 0 1000; stroke-dashoffset: -1000; }
  }
  .think .flask-stroke { animation: thinkTrace 4.2s linear infinite; }

  /* Spin */
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .spin .flask-group { animation: spin 12s linear infinite; }

  /* Bubble delays */
  .bubble:nth-child(1){ animation-delay: 0s; }
  .bubble:nth-child(2){ animation-delay: .18s; }
  .bubble:nth-child(3){ animation-delay: .36s; }
  .bubble:nth-child(4){ animation-delay: .54s; }
  .bubble:nth-child(5){ animation-delay: .72s; }
  .bubble:nth-child(6){ animation-delay: .90s; }
  .bubble:nth-child(7){ animation-delay: 1.08s; }
  .bubble:nth-child(8){ animation-delay: 1.26s; }
  .bubble:nth-child(9){ animation-delay: 1.44s; }
  .bubble:nth-child(10){ animation-delay: 1.62s; }
  .bubble:nth-child(11){ animation-delay: 1.80s; }
  .bubble:nth-child(12){ animation-delay: 1.98s; }

  /* Subtle background shimmer line */
  @keyframes shimmerLine {
    0%   { opacity: .35; transform: translateY(0); }
    50%  { opacity: .9; transform: translateY(-2px); }
    100% { opacity: .35; transform: translateY(0); }
  }
  .shimmer line { animation: shimmerLine 2.4s ease-in-out infinite; }

  /* Reset */
  .no-anim .bubble { animation: none !important; }
  .no-anim .flask-stroke { animation: none !important; }
  .no-anim .flask-group { animation: none !important; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Flask SVG Animations</h1>
    <p class="sub">Click a button to preview an Easter-egg animation. Double-click the flask to toggle bubble “thinking” mode.</p>

    <div class="stage">
      <div class="svg-wrap">
        <svg id="flask" class="no-anim" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="320" height="320" aria-label="Animated flask">
          <defs>
            <linearGradient id="flaskGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#4dd0e1;stop-opacity:0.9" />
              <stop offset="50%" style="stop-color:#9c27b0;stop-opacity:0.95" />
              <stop offset="100%" style="stop-color:#ff6b35;stop-opacity:0.9" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <filter id="softGlow">
              <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>

          <g class="flask-group">
            <path class="flask-stroke"
              d="M 70 40 L 70 70 L 50 120 Q 45 140 50 160 Q 52 170 60 175 L 140 175 Q 148 170 150 160 Q 155 140 150 120 L 130 70 L 130 40 Q 130 35 125 35 L 75 35 Q 70 35 70 40 Z"
              fill="none" stroke="url(#flaskGradient)" stroke-width="3" filter="url(#glow)"/>

            <g class="shimmer">
              <line x1="75" y1="35" x2="75" y2="45" stroke="#4dd0e1" stroke-width="1.5" opacity=".6"/>
              <line x1="125" y1="35" x2="125" y2="45" stroke="#4dd0e1" stroke-width="1.5" opacity=".6"/>
            </g>

            <g class="bubbles">
              <circle class="bubble" cx="100" cy="85" r="4" fill="#4dd0e1" filter="url(#softGlow)"/>
              <circle class="bubble" cx="80"  cy="95" r="4" fill="#00e5ff" filter="url(#softGlow)"/>
              <circle class="bubble" cx="120" cy="95" r="4" fill="#00e5ff" filter="url(#softGlow)"/>
              <circle class="bubble" cx="70"  cy="115" r="4" fill="#9c27b0" filter="url(#softGlow)"/>
              <circle class="bubble" cx="90"  cy="115" r="4" fill="#ba68c8" filter="url(#softGlow)"/>
              <circle class="bubble" cx="110" cy="115" r="4" fill="#ba68c8" filter="url(#softGlow)"/>
              <circle class="bubble" cx="130" cy="115" r="4" fill="#9c27b0" filter="url(#softGlow)"/>
              <circle class="bubble" cx="80"  cy="135" r="4" fill="#ff6b35" filter="url(#softGlow)"/>
              <circle class="bubble" cx="100" cy="135" r="4" fill="#ff8a50" filter="url(#softGlow)"/>
              <circle class="bubble" cx="120" cy="135" r="4" fill="#ff6b35" filter="url(#softGlow)"/>
              <circle class="bubble" cx="90"  cy="155" r="4" fill="#4dd0e1" filter="url(#softGlow)"/>
              <circle class="bubble" cx="110" cy="155" r="4" fill="#4dd0e1" filter="url(#softGlow)"/>

              <!-- subtle connector lines -->
              <line x1="100" y1="85" x2="80"  y2="95" stroke="#4dd0e1" stroke-width="0.5" opacity=".3"/>
              <line x1="100" y1="85" x2="120" y2="95" stroke="#4dd0e1" stroke-width="0.5" opacity=".3"/>
              <line x1="80"  y1="95" x2="70"  y2="115" stroke="#00e5ff" stroke-width="0.5" opacity=".3"/>
              <line x1="80"  y1="95" x2="90"  y2="115" stroke="#00e5ff" stroke-width="0.5" opacity=".3"/>
              <line x1="120" y1="95" x2="110" y2="115" stroke="#00e5ff" stroke-width="0.5" opacity=".3"/>
              <line x1="120" y1="95" x2="130" y2="115" stroke="#00e5ff" stroke-width="0.5" opacity=".3"/>
              <line x1="70"  y1="115" x2="80"  y2="135" stroke="#9c27b0" stroke-width="0.5" opacity=".3"/>
              <line x1="90"  y1="115" x2="80"  y2="135" stroke="#ba68c8" stroke-width="0.5" opacity=".3"/>
              <line x1="90"  y1="115" x2="100" y2="135" stroke="#ba68c8" stroke-width="0.5" opacity=".3"/>
              <line x1="110" y1="115" x2="100" y2="135" stroke="#ba68c8" stroke-width="0.5" opacity=".3"/>
              <line x1="110" y1="115" x2="120" y2="135" stroke="#ba68c8" stroke-width="0.5" opacity=".3"/>
              <line x1="130" y1="115" x2="120" y2="135" stroke="#9c27b0" stroke-width="0.5" opacity=".3"/>
              <line x1="80"  y1="135" x2="90"  y2="155" stroke="#ff6b35" stroke-width="0.5" opacity=".3"/>
              <line x1="100" y1="135" x2="90"  y2="155" stroke="#ff8a50" stroke-width="0.5" opacity=".3"/>
              <line x1="100" y1="135" x2="110" y2="155" stroke="#ff8a50" stroke-width="0.5" opacity=".3"/>
              <line x1="120" y1="135" x2="110" y2="155" stroke="#ff6b35" stroke-width="0.5" opacity=".3"/>
            </g>
          </g>
        </svg>
      </div>

      <div class="controls" role="group" aria-label="Animation controls">
        <button id="btn-bubble" class="btn-ok">Bubble Up</button>
        <button id="btn-bubble-slow">Bubble Up (slow)</button>
        <button id="btn-pulse">Pulse Glow</button>
        <button id="btn-shake">Shake + Bubbles</button>
        <button id="btn-think">Think Trace</button>
        <button id="btn-spin">Spin</button>
        <button id="btn-double">Double-click Flask</button>
        <button id="btn-reset" class="btn-warn">Reset</button>
      </div>
      <p class="hint">Tip: Double-click the flask to toggle “thinking” bubbles. You can also try typing <span class="kbd">/alchemist</span> in your app.</p>
    </div>
  </div>

<script>
  const svg = document.getElementById('flask');
  const buttons = {
    bubble: document.getElementById('btn-bubble'),
    bubbleSlow: document.getElementById('btn-bubble-slow'),
    pulse: document.getElementById('btn-pulse'),
    shake: document.getElementById('btn-shake'),
    think: document.getElementById('btn-think'),
    spin: document.getElementById('btn-spin'),
    reset: document.getElementById('btn-reset'),
    dbl: document.getElementById('btn-double')
  };

  let doubleMode = false;

  function setMode(mode){
    svg.classList.remove('bubbles','bubbles-slow','pulse','shake','think','spin','no-anim');
    if(mode === 'none') svg.classList.add('no-anim');
    else svg.classList.add(mode);
    Object.values(buttons).forEach(b => b.classList.remove('active'));
    if(mode !== 'none') buttons[mode]?.classList.add('active');
  }

  buttons.bubble.addEventListener('click', () => setMode('bubbles'));
  buttons.bubbleSlow.addEventListener('click', () => setMode('bubbles-slow'));
  buttons.pulse.addEventListener('click', () => setMode('pulse'));
  buttons.shake.addEventListener('click', () => setMode('shake'));
  buttons.think.addEventListener('click', () => setMode('think'));
  buttons.spin.addEventListener('click', () => setMode('spin'));
  buttons.reset.addEventListener('click', () => setMode('none'));

  buttons.dbl.addEventListener('click', () => {
    doubleMode = !doubleMode;
    setMode(doubleMode ? 'think' : 'none');
    buttons.dbl.textContent = doubleMode ? 'Double-click: ON' : 'Double-click: OFF';
  });

  svg.addEventListener('dblclick', () => {
    doubleMode = !doubleMode;
    setMode(doubleMode ? 'think' : 'none');
    buttons.dbl.textContent = doubleMode ? 'Double-click: ON' : 'Double-click: OFF';
  });

  // Optional: /alchemist shortcut (document-level)
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA'){
      const input = prompt('Enter command (e.g., /alchemist):', '/alchemist');
      if (input && input.trim().toLowerCase() === '/alchemist'){
        setMode('bubbles');
      }
    }
  });
</script>
</body>
</html>
