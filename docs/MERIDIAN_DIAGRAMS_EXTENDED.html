<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERIDIAN // Extended Architecture Diagrams</title>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.3/lib/elk.bundled.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;500;600;700&display=swap');
  
  :root {
    --bg-void: #020408;
    --bg-surface: #070d14;
    --bg-panel: #0b1520;
    --border-dim: #1a2d3f;
    --border-mid: #1f3a50;
    --amber: #ffd60a;
    --cyan: #00d1ff;
    --green: #10b981;
    --text-primary: #c9d8e8;
    --text-secondary: #7a96af;
    --text-muted: #3f5a70;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow', sans-serif;
  }
  
  body {
    background: var(--bg-void);
    color: var(--text-primary);
    font-family: var(--sans);
    padding: 20px;
  }
  
  .diagram-section {
    background: var(--bg-surface);
    border: 1px solid var(--border-mid);
    margin: 20px 0;
    padding: 20px;
  }
  
  .diagram-title {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--amber);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 16px;
  }
  
  .diagram-container {
    background: var(--bg-void);
    border: 1px solid var(--border-dim);
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .loading-msg {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  
  svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

<div class="diagram-section">
  <div class="diagram-title">01 // Agent Execution State Machine</div>
  <div class="diagram-container" id="agent-state-diagram">
    <span class="loading-msg">Loading...</span>
  </div>
</div>

<div class="diagram-section">
  <div class="diagram-title">02 // Hermes Causal DAG Architecture</div>
  <div class="diagram-container" id="hermes-diagram">
    <span class="loading-msg">Loading...</span>
  </div>
</div>

<div class="diagram-section">
  <div class="diagram-title">03 // Policy Engine Decision Flow</div>
  <div class="diagram-container" id="policy-diagram">
    <span class="loading-msg">Loading...</span>
  </div>
</div>

<div class="diagram-section">
  <div class="diagram-title">04 // 3-Tier Memory Architecture</div>
  <div class="diagram-container" id="memory-diagram">
    <span class="loading-msg">Loading...</span>
  </div>
</div>

<div class="diagram-section">
  <div class="diagram-title">05 // Multi-Provider Router Flow</div>
  <div class="diagram-container" id="router-diagram">
    <span class="loading-msg">Loading...</span>
  </div>
</div>

<script>
function renderELK(containerId, graph, opts = {}) {
  const container = document.getElementById(containerId);
  if (!container || typeof ELK === 'undefined') return;
  
  const elk = new ELK();
  const svgNS = 'http://www.w3.org/2000/svg';
  
  elk.layout(graph).then(g => {
    let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
    const allNodes = g.children || [];
    allNodes.forEach(n => {
      const x = n.x || 0, y = n.y || 0, w = n.width || 0, h = n.height || 0;
      minX = Math.min(minX, x);
      minY = Math.min(minY, y);
      maxX = Math.max(maxX, x + w);
      maxY = Math.max(maxY, y + h);
    });
    
    const pad = opts.padding || 32;
    const W = maxX + pad * 2;
    const H = maxY + pad * 2;
    
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('style', 'width:100%;height:auto;display:block');
    
    const defs = document.createElementNS(svgNS, 'defs');
    const mkMarker = (id, color) => {
      const m = document.createElementNS(svgNS, 'marker');
      m.setAttribute('id', id);
      m.setAttribute('markerWidth', '8');
      m.setAttribute('markerHeight', '8');
      m.setAttribute('refX', '6');
      m.setAttribute('refY', '3');
      m.setAttribute('orient', 'auto');
      const p = document.createElementNS(svgNS, 'path');
      p.setAttribute('d', 'M0,0 L0,6 L8,3 z');
      p.setAttribute('fill', color);
      m.appendChild(p);
      return m;
    };
    defs.appendChild(mkMarker('arr-dim', '#2a4d6a'));
    defs.appendChild(mkMarker('arr-green', '#10b981'));
    defs.appendChild(mkMarker('arr-amber', '#ffd60a'));
    defs.appendChild(mkMarker('arr-cyan', '#00d1ff'));
    defs.appendChild(mkMarker('arr-red', '#ef4444'));
    svg.appendChild(defs);
    
    (g.edges || []).forEach(edge => {
      (edge.sections || []).forEach(sec => {
        const path = document.createElementNS(svgNS, 'path');
        let d = '';
        const sx = (sec.startPoint?.x || 0) + pad;
        const sy = (sec.startPoint?.y || 0) + pad;
        const ex = (sec.endPoint?.x || 0) + pad;
        const ey = (sec.endPoint?.y || 0) + pad;
        if ((sec.bendPoints || []).length) {
          d = `M ${sx} ${sy}`;
          sec.bendPoints.forEach(bp => { d += ` L ${bp.x + pad} ${bp.y + pad}`; });
          d += ` L ${ex} ${ey}`;
        } else {
          d = `M ${sx} ${sy} L ${ex} ${ey}`;
        }
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-width', edge.style?.strokeWidth || '1.5');
        
        const es = edge.style || {};
        let marker = 'url(#arr-dim)';
        if (es.stroke === '#10b981') { path.setAttribute('stroke', '#10b981'); marker = 'url(#arr-green)'; }
        else if (es.stroke === '#ffd60a') { path.setAttribute('stroke', '#ffd60a'); marker = 'url(#arr-amber)'; }
        else if (es.stroke === '#00d1ff') { path.setAttribute('stroke', '#00d1ff'); marker = 'url(#arr-cyan)'; }
        else if (es.stroke === '#ef4444') { path.setAttribute('stroke', '#ef4444'); marker = 'url(#arr-red)'; }
        else { path.setAttribute('stroke', '#2a4d6a'); }
        path.setAttribute('marker-end', marker);
        svg.appendChild(path);
      });
      
      if (edge.labels) {
        edge.labels.forEach(lbl => {
          if (!lbl.x && lbl.x !== 0) return;
          const t = document.createElementNS(svgNS, 'text');
          t.setAttribute('x', lbl.x + pad);
          t.setAttribute('y', lbl.y + pad + 4);
          t.setAttribute('fill', '#3f5a70');
          t.setAttribute('font-family', '"Share Tech Mono", monospace');
          t.setAttribute('font-size', '9');
          t.setAttribute('text-anchor', 'middle');
          t.textContent = lbl.text;
          svg.appendChild(t);
        });
      }
    });
    
    allNodes.forEach(node => {
      const nx = (node.x || 0) + pad;
      const ny = (node.y || 0) + pad;
      const nw = node.width || 80;
      const nh = node.height || 38;
      const s = node.style || {};
      const g_el = document.createElementNS(svgNS, 'g');
      g_el.setAttribute('transform', `translate(${nx},${ny})`);
      
      const isCircle = node.nodeType === 'start' || node.nodeType === 'end';
      
      if (isCircle) {
        const cr = Math.min(nw, nh) / 2;
        const circ = document.createElementNS(svgNS, 'circle');
        circ.setAttribute('cx', nw / 2);
        circ.setAttribute('cy', nh / 2);
        circ.setAttribute('r', cr - 1);
        circ.setAttribute('fill', s.fill || '#070d14');
        circ.setAttribute('stroke', s.stroke || '#ffd60a');
        circ.setAttribute('stroke-width', s.strokeWidth || 2);
        g_el.appendChild(circ);
        if (node.nodeType === 'end') {
          const inner = document.createElementNS(svgNS, 'circle');
          inner.setAttribute('cx', nw / 2);
          inner.setAttribute('cy', nh / 2);
          inner.setAttribute('r', cr - 5);
          inner.setAttribute('fill', s.stroke || '#ffd60a');
          g_el.appendChild(inner);
        }
      } else {
        const r = document.createElementNS(svgNS, 'rect');
        r.setAttribute('x', 0);
        r.setAttribute('y', 0);
        r.setAttribute('width', nw);
        r.setAttribute('height', nh);
        r.setAttribute('rx', 5);
        r.setAttribute('fill', s.fill || '#0b1520');
        r.setAttribute('stroke', s.stroke || '#1f3a50');
        r.setAttribute('stroke-width', s.strokeWidth || 1);
        g_el.appendChild(r);
        
        const lbl = node.labels?.[0];
        if (lbl) {
          const t = document.createElementNS(svgNS, 'text');
          t.setAttribute('x', nw / 2);
          t.setAttribute('y', nh / 2 + 1);
          t.setAttribute('fill', '#c9d8e8');
          t.setAttribute('font-family', '"Share Tech Mono", monospace');
          t.setAttribute('font-size', lbl.fontSize || 10);
          t.setAttribute('text-anchor', 'middle');
          t.setAttribute('dominant-baseline', 'central');
          t.textContent = lbl.text;
          g_el.appendChild(t);
        }
      }
      
      svg.appendChild(g_el);
    });
    
    container.innerHTML = '';
    container.appendChild(svg);
  });
}

const GRAPHS = {
  agentState: {
    id: "agent-state",
    layoutOptions: { "elk.algorithm": "layered", "elk.direction": "DOWN", "elk.spacing.nodeNode": "30", "elk.layered.spacing.nodeNodeBetweenLayers": "50" },

      {id:"configured", width:120, height:36, labels:[{text:"CONFIGURED"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},

      {id:"e4", sources:["running"], targets:["completed"], labels:[{text:"finish"}], style:{stroke:"#10b981"}},
      {id:"e5", sources:["running"], targets:["failed"], labels:[{text:"error"}], style:{stroke:"#ef4444"}},

      {id:"e7", sources:["completed"], targets:["end"]},

  hermes: {

      {id:"ccl", width:180, height:36, labels:[{text:"Causal Core Lock"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},
      {id:"dsl", width:160, height:36, labels:[{text:"Event DSL"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},
      {id:"harness", width:160, height:36, labels:[{text:"Test Harness"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},

    ],
    edges: [
      {id:"e1", sources:["ui"], targets:["hqa"], style:{stroke:"#ffd60a"}},
      {id:"e2", sources:["hqa"], targets:["frontier"], style:{stroke:"#00d1ff"}},
      {id:"e3", sources:["frontier"], targets:["kernel"], style:{stroke:"#00d1ff"}},
      {id:"e4", sources:["kernel"], targets:["ccl"], style:{stroke:"#10b981"}},
      {id:"e5", sources:["ccl"], targets:["dsl"]},
      {id:"e6", sources:["dsl"], targets:["harness"]},
      {id:"e7", sources:["kernel"], targets:["store"]},
      {id:"e8", sources:["store"], targets:["hqa"], labels:[{text:"query"}]}
    ]
  },
  
  policy: {
    id: "policy-flow",
    layoutOptions: { "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.spacing.nodeNode": "40", "elk.layered.spacing.nodeNodeBetweenLayers": "70" },
    children: [
      {id:"action", width:140, height:36, labels:[{text:"Agent Action"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},

      {id:"exec", width:120, height:36, labels:[{text:"Execute"}], style:{fill:"#062818",stroke:"#10b981"}},

      {id:"modal", width:140, height:36, labels:[{text:"Approval Modal"}], style:{fill:"#181408",stroke:"#ffd60a"}},

    ],
    edges: [
      {id:"e1", sources:["action"], targets:["engine"]},
      {id:"e2", sources:["engine"], targets:["allow"], labels:[{text:"match"}], style:{stroke:"#10b981"}},

      {id:"e4", sources:["engine"], targets:["ask"], labels:[{text:"match"}], style:{stroke:"#ffd60a"}},
      {id:"e5", sources:["engine"], targets:["shadow"], labels:[{text:"match"}], style:{stroke:"#00d1ff"}},
      {id:"e6", sources:["allow"], targets:["exec"], style:{stroke:"#10b981"}},
      {id:"e7", sources:["block"], targets:["error"], style:{stroke:"#ef4444"}},
      {id:"e8", sources:["ask"], targets:["modal"], style:{stroke:"#ffd60a"}},
      {id:"e9", sources:["shadow"], targets:["exec"], style:{stroke:"#00d1ff"}},

    ]
  },

      {id:"e2", sources:["mgr"], targets:["session"]},
      {id:"e3", sources:["mgr"], targets:["persist"]},
      {id:"e4", sources:["mgr"], targets:["artifact"]},
      {id:"e5", sources:["session"], targets:["map"], labels:[{text:"24h TTL"}]},

  router: {
    id: "router-flow",
    layoutOptions: { "elk.algorithm": "layered", "elk.direction": "RIGHT", "elk.spacing.nodeNode": "40", "elk.layered.spacing.nodeNodeBetweenLayers": "75" },
    children: [
      {id:"request", width:140, height:36, labels:[{text:"LLM Request"}], style:{fill:"#0b1520",stroke:"#1f3a50"}},

window.addEventListener('load', () => {
  if (typeof ELK !== 'undefined') {
    renderELK('agent-state-diagram', GRAPHS.agentState, {padding: 28});
    renderELK('hermes-diagram', GRAPHS.hermes, {padding: 28});
    renderELK('policy-diagram', GRAPHS.policy, {padding: 28});
    renderELK('memory-diagram', GRAPHS.memory, {padding: 28});
    renderELK('router-diagram', GRAPHS.router, {padding: 28});
  }
});
</script>
